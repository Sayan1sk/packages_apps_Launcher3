name: Build MistOS Launcher3

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROM_MANIFEST: https://github.com/Project-Mist-OS/manifest.git
  ROM_BRANCH: 16.2
  LAUNCHER_REPO: https://github.com/Sayan1sk/packages_apps_Launcher3.git
  LAUNCHER_BRANCH: 16.2

jobs:
  build:
    name: Build Launcher3QuickStep
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++ \
            gcc \
            git \
            git-lfs \
            gnupg \
            gperf \
            lib32ncurses6 \
            lib32readline-dev \
            lib32z1 \
            libc6-dev-i386 \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lz4 \
            openjdk-17-jdk \
            python3 \
            rsync \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        shell: bash
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rom"
          cd "$GITHUB_WORKSPACE/rom"

          repo init \
            -u "$ROM_MANIFEST" \
            -b "$ROM_BRANCH" \
            --depth=1

      - name: Sync source
        shell: bash
        working-directory: rom
        run: |
          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Replace Launcher3
        shell: bash
        working-directory: rom
        run: |
          rm -rf packages/apps/Launcher3

          git clone \
            --depth=1 \
            --branch "$LAUNCHER_BRANCH" \
            "$LAUNCHER_REPO" \
            packages/apps/Launcher3

          rm -rf packages/apps/Launcher3/.git

      - name: Verify Launcher3
        shell: bash
        working-directory: rom
        run: |
          test -f packages/apps/Launcher3/Android.bp
          test -f packages/apps/Launcher3/AndroidManifest.xml
          test -f packages/apps/Launcher3/quickstep/Android.bp

          echo "Launcher3 source:"
          du -sh packages/apps/Launcher3

      - name: Load Android build environment
        shell: bash
        working-directory: rom
        run: |
          source build/envsetup.sh

          echo "Available lunch targets:"
          lunch --help || true

      - name: Stop and show build targets
        shell: bash
        working-directory: rom
        run: |
          source build/envsetup.sh
          lunch --list

      - name: Build Launcher3QuickStep
        shell: bash
        working-directory: rom
        run: |
          source build/envsetup.sh

          echo "A device lunch target must be selected before building."
          echo "Set the correct target for your device in this workflow."
          exit 1
